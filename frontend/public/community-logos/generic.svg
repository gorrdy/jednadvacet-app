<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Solid dark disc, ember-orange ring, "21" centred. Matches the rest
       of the app's visual identity (sigil "21" in the topbar). -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB769"/>
      <stop offset="100%" stop-color="#F7931A"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="#13110F"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <text x="64" y="64"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Inter', 'Helvetica Neue', system-ui, sans-serif"
        font-weight="800"
        font-size="60"
        letter-spacing="-2"
        fill="#F7931A">21</text>
</svg>
